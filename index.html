<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ece4d6">
<meta name="description" content="My personal shelf of movies, series and natok I have watched.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MovieShelf">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MovieShelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600&family=Lato:wght@400;700&display=swap">
<style>
/* Layout: a wall of wooden cabinet bays; each bay is one shelf of DVD spines that scrolls sideways. Bottom tab bar; details open as full-screen sheets. */
:root{
  --wall:#ece4d6; --wall-2:#f5efe4; --cab:#cdbb9c; --cab-top:#b9a382;
  --wood-hi:#dcae72; --wood:#b98546; --wood-lo:#7c5127;
  --ink:#2b2118; --ink-2:#6c5c4a; --panel:#fbf8f2; --panel-2:#f0e9dd; --line:#ddd0bc;
  --accent:#1f6f78; --on-accent:#ffffff; --shadow:rgba(50,30,10,.35); --glow:rgba(255,255,255,.35); --star:#d99a00;
  --imdb:#f5c518; --imdb-ink:#111; --danger:#c0392b;
  --f-spine:'Oswald','Hind Siliguri',Impact,'Arial Narrow',sans-serif;
  --f-ui:'Lato','Hind Siliguri',system-ui,-apple-system,sans-serif;
  --z:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#160b0d; --wall-2:#3b0f17; --cab:#0b0506; --cab-top:#1c0b0e;
    --wood-hi:#7a4430; --wood:#4e281b; --wood-lo:#26120b;
    --ink:#f5ebe1; --ink-2:#bda898; --panel:#1c1112; --panel-2:#2b1a1b; --line:#3d2829;
    --accent:#e4b24c; --on-accent:#1d1206; --shadow:rgba(0,0,0,.6); --glow:rgba(228,178,76,.25); --star:#f0c040;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall:#160b0d; --wall-2:#3b0f17; --cab:#0b0506; --cab-top:#1c0b0e;
  --wood-hi:#7a4430; --wood:#4e281b; --wood-lo:#26120b;
  --ink:#f5ebe1; --ink-2:#bda898; --panel:#1c1112; --panel-2:#2b1a1b; --line:#3d2829;
  --accent:#e4b24c; --on-accent:#1d1206; --shadow:rgba(0,0,0,.6); --glow:rgba(228,178,76,.25); --star:#f0c040;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--wall);background-image:radial-gradient(140% 50% at 50% 0%,var(--wall-2),var(--wall) 70%);background-attachment:fixed;color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wall)}
button{font:inherit;color:inherit}
button,label.btn,[data-act]{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;flex:none}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--wall);padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:grid;gap:10px}
.brand-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-spine);font-weight:600;font-size:26px;letter-spacing:.14em;line-height:1;margin:0;text-transform:uppercase}
.brand b{color:var(--accent);font-weight:600}
.tally{font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.tally strong{color:var(--ink);font-size:14px}
.toolrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.sm button{padding:5px 10px;font-size:12px}
.zoom{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.zoom input{width:84px;accent-color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px}
.scroll-x{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;max-width:100%}
.scroll-x::-webkit-scrollbar{display:none}

/* ---------- shelves ---------- */
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 8px}
#shelves{touch-action:pan-x pan-y;display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.banner button{flex:none}
.shelf-head{display:flex;align-items:baseline;gap:8px;margin:0 2px 6px}
.shelf-head h2{font-family:var(--f-spine);font-weight:500;font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelf-head .n{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.shelf-head .more{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:2px 0;white-space:nowrap}
.bay{position:relative;border-radius:5px 5px 0 0;background:linear-gradient(var(--cab-top),var(--cab) 40%);box-shadow:inset 0 16px 20px -12px var(--shadow),inset 12px 0 16px -14px var(--shadow),inset -12px 0 16px -14px var(--shadow)}
.row{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;padding:16px 14px 0;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.row::after{content:"";flex:0 0 10px}
.plank{height:16px;border-radius:0 0 3px 3px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 11px),linear-gradient(var(--wood-hi),var(--wood) 45%,var(--wood-lo));box-shadow:inset 0 1px 0 var(--glow),0 10px 14px -8px var(--shadow)}

/* DVD spine */
.dvd{flex:0 0 auto;position:relative;width:calc(38px*var(--z));height:calc(206px*var(--z));border:0;margin:0;padding:calc(9px*var(--z)) 0 calc(7px*var(--z));border-radius:3px 3px 1px 1px;color:var(--t);font-family:var(--f-spine);display:flex;flex-direction:column;align-items:center;gap:calc(6px*var(--z));
  background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,0) 16%,rgba(0,0,0,0) 78%,rgba(0,0,0,.3)),var(--c);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),0 -1px 0 rgba(255,255,255,.12) inset;transition:transform .22s cubic-bezier(.3,.7,.3,1.2)}
.dvd-brand{font-size:calc(8.5px*var(--z));font-weight:600;letter-spacing:.1em;writing-mode:vertical-rl;opacity:.85}
.dvd-title{flex:1 1 auto;min-height:0;writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(var(--fs)*var(--z));font-weight:500;letter-spacing:.04em;line-height:1}
.dvd-year{font-size:calc(9.5px*var(--z));font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums;opacity:.9}
.dvd-fav{font-size:calc(10px*var(--z));line-height:1;color:var(--t);font-family:var(--f-ui)}
.dvd-flag{position:absolute;bottom:calc(26px*var(--z));left:50%;width:calc(16px*var(--z));height:calc(16px*var(--z));transform:translateX(-50%);border-radius:50%;background:#fff3b0;box-shadow:0 0 0 1px rgba(0,0,0,.25);display:grid;place-items:center;font-size:calc(8px*var(--z));color:#3a2a00;font-family:var(--f-ui);font-weight:700}
.dvd.s1 .dvd-brand{background:var(--t);color:var(--c);writing-mode:horizontal-tb;width:100%;text-align:center;padding:calc(3px*var(--z)) 0;margin-top:calc(-9px*var(--z));opacity:1}
.dvd.s2{background:linear-gradient(90deg,rgba(255,255,255,.12),transparent 16%,transparent 78%,rgba(0,0,0,.35)),linear-gradient(90deg,var(--c) 0 22%,#16151a 22% 78%,var(--c) 78%);color:#f4f1ea}
.dvd.s2 .dvd-fav{color:#f4f1ea}
.dvd:hover{transform:translateY(-5px)}
.dvd.pull{transform:translateY(calc(-26px*var(--z))) rotate(-3deg)}
.dvd.empty-slot{background:transparent;box-shadow:inset 0 0 0 1px var(--line);opacity:.4;pointer-events:none}

/* cover mode */
.cov{flex:0 0 auto;position:relative;width:calc(104px*var(--z));aspect-ratio:2/3;max-width:100%;border:0;padding:0;border-radius:2px 4px 4px 2px;overflow:hidden;box-shadow:0 4px 10px -4px var(--shadow);transition:transform .22s}
.cov::before{content:"";position:absolute;inset:0 auto 0 0;width:7%;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.18) 60%,rgba(0,0,0,.2));z-index:2}
.cov.pull,.cov:hover{transform:translateY(-6px)}

/* poster (image or designed fallback) */
.pst{position:absolute;inset:0;background:var(--c);overflow:hidden}
.pst img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.pst-fb{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:10% 9%;color:var(--t);text-align:left;
  background:radial-gradient(120% 70% at 85% 10%,rgba(255,255,255,.28),transparent 55%),linear-gradient(165deg,var(--c),var(--c2))}
.pst-fb .k{font-family:var(--f-spine);font-size:9px;letter-spacing:.16em;opacity:.8}
.pst-fb .tt{font-family:var(--f-spine);font-weight:600;text-transform:uppercase;line-height:1.02;font-size:calc(15px*var(--pf,1));letter-spacing:.02em;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.pst-fb .yy{font-family:var(--f-spine);font-size:11px;opacity:.85}
.lg .pst-fb .tt{font-size:calc(22px*var(--pf,1))}
.lg .pst-fb .k{font-size:11px}

/* empty state */
.empty{display:grid;gap:14px;text-align:center;padding:28px 6px}
.empty h2{font-family:var(--f-spine);letter-spacing:.1em;text-transform:uppercase;margin:0;font-weight:500}
.empty p{margin:0;color:var(--ink-2)}
.empty .bay .row{justify-content:center;pointer-events:none}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-2);padding:4px 0}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .add{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);margin:-22px auto 0;box-shadow:0 6px 16px -6px var(--shadow);display:grid;place-items:center}
.nav .add svg{width:26px;height:26px}

/* ---------- sheets ---------- */
#sheets{position:relative;z-index:30}
.sheet{position:fixed;inset:0;background:var(--panel);overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sh-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;background:var(--panel);border-bottom:1px solid var(--line);padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.sh-bar h2{flex:1;margin:0;font-size:16px;font-weight:700;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-bar .bk{border:0;background:none;display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:700;padding:6px 4px;min-width:64px}
.sh-bar .rt{min-width:64px;display:flex;justify-content:flex-end}
.sh-body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr);max-width:760px;margin:0 auto}

/* detail */
.d-hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end;padding:18px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,var(--c) -40%,var(--panel) 100%)}
.d-poster{position:relative;width:118px;aspect-ratio:2/3;max-width:100%;border-radius:4px;overflow:hidden;box-shadow:0 12px 24px -10px var(--shadow)}
.d-head{min-width:0;display:grid;gap:6px}
.d-kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.d-head h1{margin:0;font-family:var(--f-spine);font-weight:600;font-size:26px;line-height:1.08;letter-spacing:.01em;text-wrap:balance;overflow-wrap:anywhere}
.d-orig{font-size:13px;color:var(--ink-2)}
.d-meta{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:2px 7px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;background:var(--panel-2);border:1px solid var(--line)}
.badge.imdb{background:var(--imdb);color:var(--imdb-ink);border-color:transparent}
.badge.imdb i{font-style:normal;font-family:var(--f-spine);letter-spacing:.02em}
.d-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:9px 4px;display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink-2);text-align:center}
.act svg{width:22px;height:22px}
.act.on{color:var(--accent);border-color:var(--accent)}
.blk h3{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.blk p{margin:0}
.stars{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.stars button{border:0;background:none;padding:2px;font-size:22px;line-height:1;color:var(--line)}
.stars button.on{color:var(--star)}
.stars .val{margin-left:8px;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--ink)}
.chip.ac{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip small{font-weight:400;color:var(--ink-2);margin-left:3px}
.note{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:10px;padding:10px;font:inherit}
.hist{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{background:var(--panel-2);border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5}

/* grids & lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 10px}
.gcell{border:0;background:none;padding:0;text-align:left;display:grid;gap:5px;min-width:0}
.gcell .cv{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:3px;overflow:hidden;box-shadow:0 4px 10px -5px var(--shadow)}
.gcell .cap{font-size:12px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcell .sub{font-size:11px;color:var(--ink-2);margin-top:-4px}
.list{display:grid;gap:2px}
.li{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;border:0;background:none;text-align:left;padding:8px 4px;border-bottom:1px solid var(--line);min-width:0}
.li .cv{position:relative;width:46px;aspect-ratio:2/3;border-radius:3px;overflow:hidden}
.li .cv .pst-fb{padding:6px 4px}
.li .cv .pst-fb .tt{font-size:8px;-webkit-line-clamp:4}
.li .cv .pst-fb .k,.li .cv .pst-fb .yy{display:none}
.li .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li > div{min-width:0}
.li .r{font-size:12px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}

/* search */
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px 14px 12px 42px;font:inherit;font-size:16px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-2);width:20px;height:20px}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
.hint{font-size:13px;color:var(--ink-2);margin:0}

/* forms */
.form{display:grid;gap:12px}
.fld{display:grid;gap:4px;min-width:0}
.fld > span{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:9px;padding:9px 10px;font:inherit;font-size:16px;min-width:0}
.fld textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.f-photo{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.f-pv{position:relative;width:96px;aspect-ratio:2/3;border-radius:4px;overflow:hidden;box-shadow:0 6px 14px -8px var(--shadow)}
.f-photo .btns{display:grid;gap:8px;justify-items:start}
.colorlbl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.colorlbl input{width:40px;height:30px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
.check{display:flex;gap:8px;align-items:center;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.tabs{display:flex;gap:6px}
.res-pick{display:grid;gap:14px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel-2)}
.res-pick .top2{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.res-pick .cv{position:relative;width:72px;aspect-ratio:2/3;border-radius:3px;overflow:hidden}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel-2);display:grid;gap:10px}
.card ol{margin:0;padding-left:20px;display:grid;gap:4px}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;gap:10px;align-items:center;color:var(--ink-2);font-size:14px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{display:block;font-family:var(--f-spine);font-weight:500;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--ink-2);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.panel h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.vbars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:18px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 37px);background-position:bottom}
.vbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.vbar i{display:block;width:70%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.vbar em{position:absolute;font-style:normal;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.vlabels{display:flex;gap:8px}
.vlabels span{flex:1;text-align:center;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hbars{display:grid;gap:7px}
.hb{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 2em;gap:8px;align-items:center;font-size:13px;border:0;background:none;padding:0;text-align:left;width:100%}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:10px;background:var(--panel-2);border-radius:5px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hb b{text-align:right;font-variant-numeric:tabular-nums}

/* settings */
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.th{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:var(--panel);text-align:left}
.th[aria-pressed="true"]{border-color:var(--accent)}
.th .mini{height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 10px 0}
.th .mini .sp{display:flex;gap:2px;align-items:flex-end;height:38px;padding:0 6px}
.th .mini .sp i{width:9px;border-radius:1px}
.th .mini .pl{height:6px;border-radius:0 0 2px 2px}
.th .nm{display:block;padding:7px 10px;font-size:13px;font-weight:700}
.th .nm small{font-weight:400;color:var(--ink-2)}
.fonts{display:grid;gap:6px}
.fo{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;text-align:left}
.fo[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fo .smp{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fo .nm{font-size:12px;color:var(--ink-2);font-family:var(--f-ui);flex:none}
.arr{display:grid;gap:4px}
.arr-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.arr-row input{width:20px;height:20px;accent-color:var(--accent)}
.arr-row label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.arr-row label small{font-weight:400;color:var(--ink-2)}
.arr-row.off label{color:var(--ink-2);font-weight:400}

.addrow{display:flex;gap:8px;align-items:center}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:9px;padding:9px 10px;font:inherit;font-size:16px}
.newin{margin-top:6px}
.mg-list{display:grid}
.mg-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.mg-row .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-row .n{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.mg-row.wide{grid-template-columns:minmax(0,1fr)}
.mg-ask{display:grid;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.mg-ask select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px;font:inherit;font-size:16px;max-width:100%}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:60;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){ .d-poster{width:160px} .d-head h1{font-size:34px} .tiles{grid-template-columns:repeat(4,1fr)} .themes{grid-template-columns:repeat(4,1fr)} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

<script>
(() => {

  },
  tx(fn) {
    if (!this.db) return Promise.resolve();

  },
  put(it) { return this.tx(s => s.put(it)); },

};
let ITEMS = [];

async function saveItem(it) { if (it.lang && typeof LANGS !== 'undefined' && !LANGS[it.lang] && S.langs) { S.langs.push({ key: it.lang, label: langName(it.lang) }); saveLists(); } it.updatedAt = Date.now(); const k = ITEMS.findIndex(x => x.id === it.id); if (k >= 0) ITEMS[k] = it; else ITEMS.push(it); await DB.put(it); }

const GENRE_FIX = { 'Sci-Fi & Fantasy': ['Science Fiction', 'Fantasy'], 'Action & Adventure': ['Action', 'Adventure'], 'War & Politics': ['War'], 'Kids': ['Family'], 'Soap': ['Drama'] };
function normGenres(list) { const out = []; (list || []).forEach(g => (GENRE_FIX[g] || [g]).forEach(x => { if (x && !out.includes(x)) out.push(x); })); return out; }

/* ---------------- colours ---------------- */
const PALETTE = ['#8b1e2d','#1d4e89','#0f6b5c','#6a2c91','#b4561b','#2f3e46','#9c6b00','#a4243b','#264653','#5b2a86','#1b6ca8','#7a4419','#2d6a4f','#c44536','#3d405b','#0b7285','#862e9c','#5c940d'];

function hexRgb(h) { h = (h || '#777777').replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

const textOn = c => lum(c) > .42 ? '#1b1712' : '#fbf7f0';
function shade(h, amt) { const [r, g, b] = hexRgb(h); const t = amt < 0 ? 0 : 255, p = Math.abs(amt); return rgbHex(r + (t - r) * p, g + (t - g) * p, b + (t - b) * p); }
function colorFromImage(img) {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 24; const x = c.getContext('2d');
    x.drawImage(img, 0, 0, 24, 24); const d = x.getImageData(0, 0, 24, 24).data;
    let R = 0, G = 0, B = 0, W = 0;
    for (let k = 0; k < d.length; k += 4) { const r = d[k], g = d[k+1], b = d[k+2]; const mx = Math.max(r, g, b), mn = Math.min(r, g, b); const s = mx - mn; const w = 1 + (s * s) / 400 * (mx > 30 && mx < 245 ? 1 : .2); R += r * w; G += g * w; B += b * w; W += w; }

    const L = lum(hex); if (L > .6) hex = shade(hex, -.35); else if (L < .02) hex = shade(hex, .12);

  } catch (e) { return null; }
}
function loadImage(src, cors) { return new Promise(res => { const im = new Image(); if (cors) im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = () => res(null); im.src = src; setTimeout(() => res(null), 8000); }); }

};
const TOKENS = Object.keys(THEMES.oak.v);
const FONTS = {

};
const S = {
  view: 'home', filter: 'all',
  mode: LS.get('mode', 'spine'), zoom: LS.get('zoom', 1),
  theme: LS.get('theme', 'auto'), font: LS.get('font', 'lato'),
  shelves: LS.get('shelves', { order: [], hidden: ['year:auto', 'rewatch', 'top'] }),
  pinned: LS.get('pinned', []),
  tmdb: LS.get('tmdb', ''), omdb: LS.get('omdb', ''),

function processPhoto(file) {
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = async () => {
      const im = await loadImage(fr.result, false); if (!im) return res(null);
      const W = 420, ratio = im.naturalHeight / im.naturalWidth; const w = Math.min(W, im.naturalWidth); const h = Math.round(w * ratio);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h);
      let data; try { data = c.toDataURL('image/jpeg', .82); } catch (e) { data = fr.result; }
      res({ data, color: colorFromImage(im) || hashColor(file.name) });
    };
    fr.onerror = () => res(null); fr.readAsDataURL(file);
  });
}

/* ---------------- internet data (TMDB + OMDb) ---------------- */
async function tmdb(path, params = {}) {
  const key = (S.tmdb || '').trim(); if (!key) throw new Error('nokey');
  const u = new URL('https://api.themoviedb.org/3' + path);
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  const h = { accept: 'application/json' };
  if (key.length > 40) h.Authorization = 'Bearer ' + key; else u.searchParams.set('api_key', key);
  let r; try { r = await fetch(u.toString(), { headers: h }); } catch (e) { throw new Error('net'); }
  if (r.status === 401) throw new Error('badkey'); if (!r.ok) throw new Error('http');
  return r.json();
}
function errText(e) { return { nokey: 'Add your free TMDB key in Settings first.', badkey: 'TMDB did not accept the key. Check it in Settings.', net: 'Could not reach the internet. Check your connection and try again.', http: 'TMDB had a problem. Try again in a minute.' }[e.message] || 'Something went wrong. Try again.'; }
function shortPlot(t) {
  t = (t || '').replace(/\s+/g, ' ').trim(); if (t.length <= 260) return t;
  const cut = t.slice(0, 260); const m = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('। '));
  return m > 110 ? cut.slice(0, m + 1) : cut.replace(/\s+\S*$/, '') + '…';
}
async function imdbFor(id) {
  if (!id || !(S.omdb || '').trim()) return null;
  try { const r = await fetch(`https://www.omdbapi.com/?i=${encodeURIComponent(id)}&apikey=${encodeURIComponent(S.omdb.trim())}`); const j = await r.json(); return j && j.imdbRating && j.imdbRating !== 'N/A' ? parseFloat(j.imdbRating) : null; } catch (e) { return null; }
}
async function fetchDetails(mt, id) {
  const d = await tmdb(`/${mt}/${id}`, { language: 'en-US', append_to_response: mt === 'movie' ? 'credits,translations' : 'credits,external_ids,translations' });
  const isMovie = mt === 'movie';
  const date = isMovie ? d.release_date : d.first_air_date;
  const countries = isMovie ? [...(d.origin_country || []), ...(d.production_countries || []).map(c => c.iso_3166_1)] : (d.origin_country || []);
  let lang = d.original_language || 'other'; if (lang === 'bn') lang = countries.includes('BD') ? 'bn-bd' : 'bn-in';
  const crew = (d.credits && d.credits.crew) || [];
  let director = isMovie ? crew.filter(c => c.job === 'Director').map(c => c.name) : (d.created_by || []).map(c => c.name);
  if (!director.length) director = crew.filter(c => c.job === 'Director').map(c => c.name);
  const bn = ((d.translations && d.translations.translations) || []).find(t => t.iso_639_1 === 'bn' && t.data && t.data.overview);
  const imdbId = isMovie ? d.imdb_id : (d.external_ids && d.external_ids.imdb_id);
  return {
    tmdbId: d.id, tmdbType: mt,
    title: isMovie ? d.title : d.name, originalTitle: isMovie ? d.original_title : d.original_name,
    year: date ? +date.slice(0, 4) : null, lang,
    genres: normGenres((d.genres || []).map(g => g.name)),
    director: [...new Set(director)].slice(0, 3),
    cast: ((d.credits && d.credits.cast) || []).slice(0, 8).map(c => c.name),
    runtime: isMovie ? (d.runtime || null) : ((d.episode_run_time || [])[0] || null),
    seasons: isMovie ? null : (d.number_of_seasons || null),
    plot: shortPlot(bn ? bn.data.overview : d.overview),
    poster: d.poster_path ? 'https://image.tmdb.org/t/p/w342' + d.poster_path : '',
    tmdbRating: d.vote_average ? Math.round(d.vote_average * 10) / 10 : null,
    imdbId: imdbId || '', imdbRating: await imdbFor(imdbId)
  };
}

async function addPicked(s) {
  const r = addState.pick; const dup = ITEMS.find(i => i.tmdbId === r.id && i.tmdbType === r.media_type);
  if (dup) { toast('Already on your shelf'); closeAll(); openDetail(dup.id); return; }
  $('#pickBtns', s).innerHTML = '<div class="loading"><span class="spinner"></span>Getting poster, cast and story…</div>';
  try {
    const d = await fetchDetails(r.media_type, r.id);
    const it = Object.assign({ id: newId(), addedAt: Date.now(), favorite: false, myRating: 0, note: '' }, d, { type: r._type, status: r._status });
    it.watchCount = it.status === 'watched' ? 1 : 0; it.watchDates = it.status === 'watched' ? [today()] : [];
    if (it.type !== 'movie' && it.status === 'watched' && it.seasons) it.seasonsWatched = it.seasons;
    it.spineColor = (await posterColor(it.poster)) || hashColor(it.title);
    await saveItem(it); afterAdd(it);
  } catch (e) { $('#pickBtns', s).innerHTML = `<p class="hint">${errText(e)}</p><button class="btn" data-act="pickAdd">Try again</button>`; }
}
function afterAdd(it) { closeAll(); if (S.view !== 'home') showView('home'); else renderHome(); setTimeout(() => openDetail(it.id), 300); toast('Added to your shelf'); }
async function refreshFromNet(i) {
  toast('Updating…');
  try {
    const d = await fetchDetails(i.tmdbType || (i.type === 'movie' ? 'movie' : 'tv'), i.tmdbId);
    const keep = { title: i.title, plot: i.plot };
    Object.assign(i, d, { title: keep.title || d.title, plot: keep.plot || d.plot });
    if (!i.colorManual) i.spineColor = (await posterColor(i.poster)) || i.spineColor;
    await saveItem(i); rerenderAll(); toast('Updated');
  } catch (e) { toast(errText(e)); }
}

/* ---------------- stats ---------------- */
function watchYears(i) {
  if (i.status !== 'watched') return [];
  const d = (i.watchDates || []).map(x => +String(x).slice(0, 4)).filter(Boolean);
  const extra = Math.max(0, (i.watchCount || 1) - d.length);
  const fallback = new Date(i.addedAt || Date.now()).getFullYear();
  return d.concat(Array(extra).fill(d.length ? d[d.length - 1] : fallback));
}
function hbars(rows, act) {
  const max = Math.max(1, ...rows.map(r => r[1]));
  return `<div class="hbars">${rows.map(([k, n, key]) => `<button class="hb" ${act ? `data-act="${act}" ${act === 'person' ? `data-name="${esc(k)}"` : `data-key="${esc(key)}"`}` : ''}><span>${esc(k)}</span><span class="tr"><i style="width:${(n / max * 100).toFixed(1)}%"></i></span><b>${n}</b></button>`).join('')}</div>`;
}
function renderStats() {
  const el = $('#view-stats');
  if (!ITEMS.length) { el.innerHTML = `<div class="empty"><h2>No numbers yet</h2><p>Your counts appear here once you add titles.</p></div>`; return; }
  const watched = ITEMS.filter(i => i.status === 'watched');
  const perYear = new Map(); ITEMS.forEach(i => watchYears(i).forEach(y => perYear.set(y, (perYear.get(y) || 0) + 1)));
  const ys = []; const minY = Math.min(THIS_YEAR, ...perYear.keys()); for (let y = Math.max(minY, THIS_YEAR - 7); y <= THIS_YEAR; y++) ys.push(y);
  const maxY = Math.max(1, ...ys.map(y => perYear.get(y) || 0));
  const sessions = ITEMS.reduce((n, i) => n + watchYears(i).length, 0);
  const cnt = (f, list = ITEMS) => { const m = new Map(); list.forEach(i => f(i).forEach(v => v && m.set(v, (m.get(v) || 0) + 1))); return [...m.entries()].sort((a, b) => b[1] - a[1]); };
  const rated = ITEMS.filter(i => i.myRating); const avg = rated.length ? (rated.reduce((n, i) => n + i.myRating, 0) / rated.length).toFixed(1) : '–';
  const rewatched = ITEMS.filter(i => (i.watchCount || 0) > 1).sort((a, b) => b.watchCount - a.watchCount).slice(0, 6);
  el.innerHTML = `<div class="stack">
    <div class="tiles">
      <div class="tile"><b>${ITEMS.reduce((n, i) => n + watchYears(i).filter(y => y === THIS_YEAR).length, 0)}</b><span>Watched in ${THIS_YEAR}</span></div>
      <div class="tile"><b>${watched.length}</b><span>Titles watched</span></div>
      <div class="tile"><b>${ITEMS.filter(i => i.status === 'watchlist').length}</b><span>Want to watch</span></div>
      <div class="tile"><b>${avg}</b><span>My average rating</span></div>
    </div>
    <div class="panel"><h3>Watched per year</h3>
      <div class="vbars">${ys.map(y => { const n = perYear.get(y) || 0; const h = n / maxY * 100; return `<div class="vbar"><em style="bottom:calc(${h}% + 3px)">${n || ''}</em><i style="height:${h}%"></i></div>`; }).join('')}</div>
      <div class="vlabels">${ys.map(y => `<span>${String(y).slice(2) === String(THIS_YEAR).slice(2) ? y : "'" + String(y).slice(2)}</span>`).join('')}</div>
      <p class="hint">${sessions} viewings in total, rewatches included.</p></div>
    <div class="panel"><h3>By type</h3>${hbars(Object.keys(TYPES).map(t => [TYPE_PL[t], ITEMS.filter(i => i.type === t).length, 'type:' + t]), 'openList')}</div>
    <div class="panel"><h3>By language</h3>${hbars(cnt(i => [i.lang]).map(([l, n]) => [langName(l), n, 'lang:' + l]), 'openList')}</div>
    <div class="panel"><h3>Top categories</h3>${hbars(cnt(i => i.genres || []).slice(0, 8).map(([g, n]) => [g, n, 'genre:' + g]), 'openList')}</div>
    <div class="panel"><h3>Actors you watch most</h3>${hbars(cnt(i => i.cast || []).slice(0, 8), 'person')}</div>
    ${rewatched.length ? `<div class="panel"><h3>Watched more than once</h3><div class="list">${rewatched.map(i => listRowHTML(i, i.watchCount + '×')).join('')}</div></div>` : ''}
  </div>`;
}

function renameShelfKey(oldK, newK) {
  const fix = arr => [...new Set(arr.map(k => k === oldK ? newK : k))];
  S.shelves.order = fix(S.shelves.order); S.shelves.hidden = fix(S.shelves.hidden); saveShelves();
}
function dropShelfKey(k) { S.shelves.order = S.shelves.order.filter(x => x !== k); S.shelves.hidden = S.shelves.hidden.filter(x => x !== k); saveShelves(); }
async function mgRename(key, name) {
  name = String(name || '').trim(); if (!name) { toast('Name cannot be empty'); return; }
  if (MG.tab === 'genres') {
    const changed = [];
    ITEMS.forEach(i => { if ((i.genres || []).some(x => sameName(x, key))) { const g = i.genres.map(x => sameName(x, key) ? name : x); i.genres = g.filter((x, k) => g.findIndex(y => sameName(y, x)) === k); changed.push(i); } });
    S.genreList = S.genreList.map(x => sameName(x, key) ? name : x).filter((x, k, a) => a.findIndex(y => sameName(y, x)) === k);
    if (!S.genreList.some(x => sameName(x, name))) S.genreList.push(name);
    saveLists(); renameShelfKey('genre:' + key, 'genre:' + name); await DB.putMany(changed);
  } else if (MG.tab === 'types') {
    const t = S.types.find(x => x.key === key); if (!t) return; t.label = name; t.pl = name; t.spine = name.toUpperCase().slice(0, 10); saveLists();
  } else {
    const l = S.langs.find(x => x.key === key); if (!l) return; l.label = name; saveLists();
  }
  toast('Renamed');
}
async function mgDelete(key, s) {
  const changed = [];
  if (MG.tab === 'genres') {
    ITEMS.forEach(i => { if ((i.genres || []).some(x => sameName(x, key))) { i.genres = i.genres.filter(x => !sameName(x, key)); changed.push(i); } });
    S.genreList = S.genreList.filter(x => !sameName(x, key)); dropShelfKey('genre:' + key);
  } else {
    const pool = MG.tab === 'types' ? S.types : S.langs;
    if (pool.length < 2) { toast(`Keep at least one ${MG_TXT[MG.tab].one}`); return; }
    const sel = $('#mgMove', s); const target = sel ? sel.value : pool.find(x => x.key !== key).key;
    const field = MG.tab === 'types' ? 'type' : 'lang';
    ITEMS.forEach(i => { if (i[field] === key) { i[field] = target; changed.push(i); } });
    if (MG.tab === 'types') { S.types = S.types.filter(x => x.key !== key); dropShelfKey('type:' + key); if (S.filter === key) S.filter = 'all'; }
    else { S.langs = S.langs.filter(x => x.key !== key); dropShelfKey('lang:' + key); }
  }

    await DB.putMany(clean);

(() => {
  let d0 = 0, z0 = 1; const box = $('#shelves');
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  box.addEventListener('touchstart', e => { if (e.touches.length === 2) { d0 = dist(e.touches); z0 = S.zoom; } }, { passive: true });
  box.addEventListener('touchmove', e => { if (e.touches.length === 2 && d0) { e.preventDefault(); setZoom(z0 * dist(e.touches) / d0); } }, { passive: false });
  box.addEventListener('touchend', () => { d0 = 0; });
})();

/* ---------------- start ---------------- */
(async function start() {
  applyLook();
  await DB.open();
  ITEMS = await DB.all();
  if (!ITEMS.length && !LS.get('seeded', 0)) { ITEMS = examples(); await DB.putMany(ITEMS); LS.set('seeded', 1); }
  showView('home');
  if (!FRAMED && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
</script>
